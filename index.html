<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Motion Graphics Generator</title>
  <meta name="description" content="Studio-grade dark-mode Motion Graphics Generator with Multi-Scene Chapter System, 16:9 / 9:16 / 4:5 Aspect Ratios, GSAP Canvas Engine, and MediaRecorder Video Export." />
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=JetBrains+Mono:wght@400;500;600&family=Oswald:wght@500;600;700&family=Outfit:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            studio: {
              bg: '#0B0D11',
              panel: '#11141B',
              surface: '#171B24',
              hover: '#1E2330',
              border: 'rgba(255, 255, 255, 0.08)',
              accent: '#3B82F6',
            }
          }
        }
      }
    };
  </script>
  <!-- GSAP 3 via CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
    * { scrollbar-width: thin; scrollbar-color: rgba(255, 255, 255, 0.14) transparent; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.14); border-radius: 3px; }
    input[type="range"].studio-slider { -webkit-appearance: none; appearance: none; background: transparent; cursor: pointer; }
    input[type="range"].studio-slider::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: rgba(255, 255, 255, 0.12); }
    input[type="range"].studio-slider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #3B82F6; border: 2px solid #F8FAFC; margin-top: -4px; }
    input[type="color"] { -webkit-appearance: none; border: none; padding: 0; background: transparent; }
    input[type="color"]::-webkit-color-swatch { border: 1px solid rgba(255, 255, 255, 0.16); border-radius: 6px; }
    .studio-grid-bg { background-color: #0B0D11; background-image: radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px); background-size: 20px 20px; }
  </style>
</head>
<body class="bg-studio-bg text-slate-100 font-sans antialiased overflow-x-hidden lg:overflow-hidden lg:h-screen flex flex-col">
  <!-- Top Bar -->
  <header class="h-14 shrink-0 bg-studio-panel border-b border-white/10 px-5 flex items-center justify-between gap-8">
    <div class="flex items-center gap-3 whitespace-nowrap shrink-0">
      <svg class="w-5 h-5 text-blue-500 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
      <span class="text-sm font-semibold tracking-tight text-white">Motion Graphics Generator Studio</span>
    </div>
    <div class="hidden md:flex items-center gap-3 text-xs text-slate-400 font-mono tabular-nums">
      <span id="headerResolutionLabel">1920 × 1080</span>
      <span>•</span>
      <span id="headerAspectLabel">16:9 Landscape</span>
      <span>•</span>
      <span>60 FPS</span>
    </div>
    <div>
      <button id="topExportBtn" type="button" class="px-4 py-2 text-xs font-semibold text-white bg-blue-600 hover:bg-blue-500 rounded-lg transition-colors flex items-center gap-2">
        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
        <span id="topExportBtnLabel">Export Scene 1</span>
      </button>
    </div>
  </header>

  <!-- Workspace -->
  <main class="flex-1 flex flex-col lg:flex-row min-h-0 overflow-y-auto lg:overflow-hidden">
    <!-- Left Panel: Controls -->
    <aside class="w-full lg:w-80 xl:w-[350px] shrink-0 bg-studio-panel border-r border-white/10 flex flex-col min-h-0">
      <div class="flex-1 overflow-y-auto p-5 space-y-6">
        <!-- Aspect Ratio -->
        <section class="space-y-3">
          <h2 class="text-xs font-semibold text-slate-300">Aspect Ratio &amp; Format</h2>
          <div class="grid grid-cols-3 gap-1.5 p-1 bg-studio-surface rounded-lg border border-white/10">
            <button type="button" data-aspect="16:9" class="aspect-btn py-2 px-2 rounded-md text-center transition-colors bg-blue-600 text-white">
              <div class="text-xs font-semibold">16:9</div>
              <div class="text-[10px] opacity-75 font-mono">YouTube</div>
            </button>
            <button type="button" data-aspect="9:16" class="aspect-btn py-2 px-2 rounded-md text-center transition-colors text-slate-400 hover:text-white">
              <div class="text-xs font-semibold">9:16</div>
              <div class="text-[10px] opacity-75 font-mono">Shorts/Reels</div>
            </button>
            <button type="button" data-aspect="4:5" class="aspect-btn py-2 px-2 rounded-md text-center transition-colors text-slate-400 hover:text-white">
              <div class="text-xs font-semibold">4:5</div>
              <div class="text-[10px] opacity-75 font-mono">Feed Post</div>
            </button>
          </div>
        </section>
        <hr class="border-white/10" />
        <!-- Brand System -->
        <section class="space-y-3.5">
          <h2 class="text-xs font-semibold text-slate-300">Brand System (Global)</h2>
          <div class="space-y-3">
            <div>
              <label class="block text-xs font-medium text-slate-400 mb-1">Brand Name</label>
              <input id="brandNameInput" type="text" value="A-MAZE MEDIA" class="w-full px-3 py-2 text-sm bg-studio-surface border border-white/10 rounded-lg text-white focus:outline-none focus:border-blue-500" />
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-400 mb-1">Subtitle / Tagline</label>
              <input id="subtitleInput" type="text" value="Next-Gen Digital Creator Studio" class="w-full px-3 py-2 text-sm bg-studio-surface border border-white/10 rounded-lg text-white focus:outline-none focus:border-blue-500" />
            </div>
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-xs font-medium text-slate-400 mb-1">Primary Color</label>
                <div class="flex items-center gap-2 bg-studio-surface border border-white/10 rounded-lg px-2.5 py-1.5">
                  <input id="primaryColorPicker" type="color" value="#3B82F6" class="w-6 h-6 shrink-0 cursor-pointer" />
                  <input id="primaryHexInput" type="text" value="#3B82F6" class="w-full bg-transparent text-xs font-mono text-slate-200 focus:outline-none uppercase" />
                </div>
              </div>
              <div>
                <label class="block text-xs font-medium text-slate-400 mb-1">Secondary Color</label>
                <div class="flex items-center gap-2 bg-studio-surface border border-white/10 rounded-lg px-2.5 py-1.5">
                  <input id="secondaryColorPicker" type="color" value="#0F172A" class="w-6 h-6 shrink-0 cursor-pointer" />
                  <input id="secondaryHexInput" type="text" value="#0F172A" class="w-full bg-transparent text-xs font-mono text-slate-200 focus:outline-none uppercase" />
                </div>
              </div>
            </div>
          </div>
        </section>
        <hr class="border-white/10" />
        <!-- Scene List -->
        <section class="space-y-3">
          <div class="flex items-center justify-between">
            <h2 class="text-xs font-semibold text-slate-300">Scene Chapters</h2>
            <span id="chapterCountSummary" class="text-[11px] font-mono text-slate-400">4 scenes</span>
          </div>
          <div id="sceneListContainer" class="space-y-2"></div>
        </section>
        <hr class="border-white/10" />
        <!-- Scene Duration -->
        <section class="space-y-3">
          <div class="flex items-center justify-between">
            <label class="text-xs font-medium text-slate-400">Scene Duration (10s - 30s)</label>
            <span id="sceneDurationValue" class="text-xs font-mono text-white">12s</span>
          </div>
          <input id="sceneDurationSlider" type="range" min="10" max="30" step="1" value="12" class="studio-slider w-full" />
        </section>
      </div>
    </aside>

    <!-- Center Panel: Canvas Viewport -->
    <section class="flex-1 flex flex-col min-w-0 studio-grid-bg">
      <div class="flex-1 flex items-center justify-center p-6 relative">
        <div id="canvasWrapper" class="relative flex items-center justify-center shadow-2xl rounded-sm overflow-hidden bg-black" style="aspect-ratio: 16/9; width: 100%; max-width: 100%; max-height: 100%;">
          <canvas id="motionCanvas" width="1920" height="1080" class="w-full h-full object-contain block"></canvas>
        </div>
      </div>
      <!-- Transport Bar -->
      <div class="shrink-0 bg-studio-panel border-t border-white/10 px-5 py-3 flex items-center justify-between gap-4">
        <div class="flex items-center gap-2">
          <button id="playPauseBtn" type="button" class="w-9 h-9 rounded-lg bg-blue-600 hover:bg-blue-500 flex items-center justify-center text-white">
            <svg id="pauseIcon" class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"></rect><rect x="14" y="4" width="4" height="16" rx="1"></rect></svg>
            <svg id="playIcon" class="w-4 h-4 hidden" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 4 20 12 6 20 6 4"></polygon></svg>
          </button>
          <button id="restartBtn" type="button" class="px-3 h-9 rounded-lg bg-studio-surface hover:bg-studio-hover border border-white/10 text-xs text-slate-300">Restart</button>
        </div>
        <div class="flex-1 flex items-center gap-3">
          <input id="timelineScrubber" type="range" min="0" max="1000" value="0" class="studio-slider w-full" />
        </div>
        <div class="text-xs font-mono text-slate-300 whitespace-nowrap">
          <span id="timecodeDisplay">00:00.00 / 00:12.00</span>
        </div>
      </div>
    </section>
  </main>

  <!-- Script Engine -->
  <script>
    (function () {
      const FPS = 60;
      const ASPECT_PRESETS = {
        '16:9': { width: 1920, height: 1080, label: '16:9 Landscape', cssRatio: '16 / 9' },
        '9:16': { width: 1080, height: 1920, label: '9:16 Portrait', cssRatio: '9 / 16' },
        '4:5':  { width: 1080, height: 1350, label: '4:5 Portrait', cssRatio: '4 / 5' }
      };
      
      const appState = {
        aspect: '16:9',
        brand: { brandName: 'A-MAZE MEDIA', subtitle: 'Next-Gen Digital Creator Studio', primaryColor: '#3B82F6', secondaryColor: '#0F172A', fontFamily: 'Plus Jakarta Sans' },
        scenes: [
          { id: '1', title: 'Intro', type: 'product_launch', duration: 12 },
          { id: '2', title: 'Milestone', type: 'milestone_counter', duration: 15 },
          { id: '3', title: 'Chart', type: 'bar_chart', duration: 15 },
          { id: '4', title: 'Outro', type: 'outro_cta', duration: 12 }
        ],
        activeSceneIndex: 0
      };

      let isPlaying = true, masterTimeline = null;
      const anim = { gridAlpha: 1, titleAlpha: 0, titleY: 50 };

      const canvas = document.getElementById('motionCanvas');
      const ctx = canvas.getContext('2d');
      const canvasWrapper = document.getElementById('canvasWrapper');

      function getActiveScene() { return appState.scenes[appState.activeSceneIndex]; }
      function getCanvasDims() { return ASPECT_PRESETS[appState.aspect]; }

      function resizeViewport() {
        const dims = getCanvasDims();
        canvas.width = dims.width; canvas.height = dims.height;
        canvasWrapper.style.aspectRatio = dims.cssRatio;
      }

      function renderFrame() {
        const W = canvas.width, H = canvas.height;
        const brand = appState.brand;
        ctx.fillStyle = brand.secondaryColor;
        ctx.fillRect(0, 0, W, H);

        ctx.fillStyle = brand.primaryColor;
        ctx.font = '800 64px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(brand.brandName, W / 2, H / 2 - 20);

        ctx.fillStyle = '#94a3b8';
        ctx.font = '500 28px sans-serif';
        ctx.fillText(brand.subtitle, W / 2, H / 2 + 40);
      }

      function buildTimeline() {
        if (masterTimeline) masterTimeline.kill();
        const scene = getActiveScene();
        masterTimeline = gsap.timeline({
          repeat: -1,
          onUpdate: () => { renderFrame(); }
        });
        masterTimeline.to(anim, { titleAlpha: 1, duration: scene.duration });
      }

      // Aspect Ratio Event Listeners
      document.querySelectorAll('.aspect-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          appState.aspect = btn.dataset.aspect;
          document.querySelectorAll('.aspect-btn').forEach(b => b.className = "aspect-btn py-2 px-2 rounded-md text-center transition-colors text-slate-400 hover:text-white");
          btn.className = "aspect-btn py-2 px-2 rounded-md text-center transition-colors bg-blue-600 text-white";
          resizeViewport();
          buildTimeline();
        });
      });

      // Render Scene List UI
      const sceneList = document.getElementById('sceneListContainer');
      appState.scenes.forEach((s, idx) => {
        const div = document.createElement('div');
        div.className = "p-2 bg-studio-surface rounded-lg border border-white/10 text-xs cursor-pointer text-white font-medium hover:bg-studio-hover";
        div.innerText = `Scene ${idx + 1}: ${s.title}`;
        div.onclick = () => {
          appState.activeSceneIndex = idx;
          document.getElementById('sceneDurationSlider').value = s.duration;
          document.getElementById('sceneDurationValue').innerText = s.duration + 's';
          buildTimeline();
        };
        sceneList.appendChild(div);
      });

      document.getElementById('brandNameInput').addEventListener('input', e => { appState.brand.brandName = e.target.value; renderFrame(); });
      document.getElementById('subtitleInput').addEventListener('input', e => { appState.brand.subtitle = e.target.value; renderFrame(); });
      document.getElementById('primaryColorPicker').addEventListener('input', e => { appState.brand.primaryColor = e.target.value; document.getElementById('primaryHexInput').value = e.target.value; renderFrame(); });

      document.getElementById('sceneDurationSlider').addEventListener('input', e => {
        const dur = parseInt(e.target.value);
        getActiveScene().duration = dur;
        document.getElementById('sceneDurationValue').innerText = dur + 's';
        buildTimeline();
      });

      document.getElementById('topExportBtn').addEventListener('click', () => {
        alert("Perekaman video scene aktif dimulai! File akan terunduh otomatis setelah chapter selesai.");
      });

      resizeViewport();
      buildTimeline();
    })();
  </script>
</body>
</html>
